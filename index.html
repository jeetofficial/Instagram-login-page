<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Login UI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#121212;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
width:90%;
max-width:360px;
text-align:center;
}

.back{
font-size:30px;
text-align:left;
margin-bottom:30px;
cursor:pointer;
}

select{
background:none;
border:none;
color:#aaa;
font-size:17px;
margin-bottom:35px;
outline:none;
}

.logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 35px;
}

input{
width:100%;
padding:18px;
margin:10px 0;
background:#1f1f1f;
border:1px solid #444;
border-radius:15px;
font-size:16px;
color:white;
outline:none;
transition:.3s;
}

input:focus{
border-color:#0d6efd;
}

input::placeholder{
color:#888;
}

button{
width:100%;
padding:16px;
margin-top:15px;
border:none;
border-radius:30px;
background:#0d6efd;
color:white;
font-size:20px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(.98);
}

button:disabled{
opacity:.6;
cursor:not-allowed;
transform:none;
}

.forgot{
display:block;
margin-top:25px;
text-decoration:none;
color:white;
font-size:17px;
}

.create{
margin-top:40px;
width:100%;
padding:16px;
border-radius:30px;
background:none;
border:2px solid #0d6efd;
color:#0d6efd;
font-size:18px;
}

.footer{
margin-top:30px;
color:#bbb;
font-size:24px;
}

/* Toast message */
.toast{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
background:#333;
color:white;
padding:12px 25px;
border-radius:20px;
font-size:15px;
opacity:0;
transition:opacity .4s;
pointer-events:none;
white-space:nowrap;
max-width:90%;
overflow:hidden;
text-overflow:ellipsis;
}

.toast.show{
opacity:1;
}

/* Error border */
input.error{
border-color:#ff4444;
}

/* Simple spinner shown inside the login button while a request is in flight */
.spinner{
display:inline-block;
width:18px;
height:18px;
border:3px solid rgba(255,255,255,.4);
border-top-color:#fff;
border-radius:50%;
animation:spin .7s linear infinite;
vertical-align:middle;
}

@keyframes spin{
to{ transform:rotate(360deg); }
}
</style>

</head>
<body>

<div class="container">

  <div class="back" onclick="goBack()">←</div>

  <select id="langSelect" onchange="changeLanguage()">
    <option value="en-uk">English (UK)</option>
    <option value="en-us">English (US)</option>
    <option value="hi">Hindi</option>
  </select>

  <!-- Instagram Logo -->
  <div class="logo-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="ig-grad" cx="30%" cy="100%" r="130%">
          <stop offset="0%"   stop-color="#ffd600"/>
          <stop offset="20%"  stop-color="#ff7a00"/>
          <stop offset="45%"  stop-color="#ff0069"/>
          <stop offset="70%"  stop-color="#d300c4"/>
          <stop offset="100%" stop-color="#7638fa"/>
        </radialGradient>
      </defs>
      <rect width="100" height="100" rx="28" ry="28" fill="url(#ig-grad)"/>
      <rect x="20" y="20" width="60" height="60" rx="17" ry="17"
            fill="none" stroke="white" stroke-width="6"/>
      <circle cx="50" cy="51" r="15"
              fill="none" stroke="white" stroke-width="6"/>
      <circle cx="68" cy="32" r="4.5" fill="white"/>
    </svg>
  </div>

  <input type="text" id="username" placeholder="Username or Email">
  <input type="password" id="password" placeholder="Password">

  <button id="loginBtn" onclick="login()">Log in</button>

  <a href="#" class="forgot" onclick="forgotPassword(); return false;">Forgot password?</a>

  <button class="create" onclick="createAccount()">Create new account</button>

  <div class="footer">∞ Meta</div>

</div>

<!-- Toast Notification -->
<div class="toast" id="toast"></div>

<script>
  // ====== CONFIG ======
  // Apna backend base URL yahan set karo. Agar same server se HTML serve ho raha
  // hai (e.g. Express static + API dono same port pe) to '' hi rehne do,
  // taaki fetch('/api/login') relative chale.
  const API_BASE = '';

  // Toast function
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function setLoading(isLoading) {
    const btn = document.getElementById('loginBtn');
    if (isLoading) {
      btn.disabled = true;
      btn.dataset.label = btn.textContent;
      btn.innerHTML = '<span class="spinner"></span>';
    } else {
      btn.disabled = false;
      btn.textContent = btn.dataset.label || 'Log in';
    }
  }

  function validate(username, password) {
    const uEl = document.getElementById('username');
    const pEl = document.getElementById('password');
    uEl.classList.remove('error');
    pEl.classList.remove('error');

    if (username === '' && password === '') {
      uEl.classList.add('error');
      pEl.classList.add('error');
      showToast('⚠️ Username aur Password dono bharo');
      return false;
    }
    if (username === '') {
      uEl.classList.add('error');
      showToast('⚠️ Username ya Email bharo');
      return false;
    }
    if (password === '') {
      pEl.classList.add('error');
      showToast('⚠️ Password bharo');
      return false;
    }
    if (password.length < 6) {
      pEl.classList.add('error');
      showToast('⚠️ Password kam se kam 6 characters ka hona chahiye');
      return false;
    }
    return true;
  }

  // Login button — ab yeh real backend ko call karta hai
  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!validate(username, password)) return;

    setLoading(true);
    try {
      const res = await fetch(`${API_BASE}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      // Agar route hi exist nahi karta, server aksar HTML 404 page bhejta hai
      // jo JSON nahi hota — isse "Route nahi mila" wagera errors idhar catch honge.
      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        showToast(`❌ Server se JSON nahi mila (status ${res.status}). Route ya URL check karo.`);
        return;
      }

      const data = await res.json();

      if (!res.ok) {
        showToast('❌ ' + (data.message || `Login fail (status ${res.status})`));
        return;
      }

      showToast('✅ Login ho gaya! Welcome ' + (data.username || username));
      // yahan par redirect ya token save kar sakte ho, e.g.:
      // localStorage.setItem('token', data.token);
      // window.location.href = '/dashboard';

    } catch (err) {
      // Network fail, server down, CORS block, wrong port, etc.
      showToast('❌ Server tak pahunch nahi paye. Kya server chal raha hai?');
      console.error('Login error:', err);
    } finally {
      setLoading(false);
    }
  }

  // Enter key se login (dono fields se)
  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  // Forgot Password — real backend call
  async function forgotPassword() {
    const username = document.getElementById('username').value.trim();
    if (username === '') {
      showToast('📧 Pehle Username ya Email dalo');
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      });
      if (!res.ok) {
        showToast(`❌ Reset link bhejne me dikkat (status ${res.status})`);
        return;
      }
      showToast('📧 Password reset link bhej diya: ' + username);
    } catch (err) {
      showToast('❌ Server tak pahunch nahi paye.');
      console.error('Forgot password error:', err);
    }
  }

  // Create Account — actual signup page pe le jao
  function createAccount() {
    // Apne signup route/page ka actual path yahan daalo
    window.location.href = '/signup.html';
  }

  // Back button
  function goBack() {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      showToast('⬅️ Peeche jane ke liye koi page nahi hai');
    }
  }

  // Language Change (UI text abhi hardcoded hai — asli i18n ke liye translations
  // object ya i18n library chahiye hogi)
  function changeLanguage() {
    const lang = document.getElementById('langSelect').value;
    if (lang === 'hi') {
      showToast('🌐 Hindi selected');
    } else if (lang === 'en-us') {
      showToast('🌐 English (US) selected');
    } else {
      showToast('🌐 English (UK) selected');
    }
  }
</script>

</body>
</html>
